name: character_overlay_reminder
description: A Flutter reminder app with character overlay functionality
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Overlay Window for floating character
  flutter_overlay_window: ^0.5.0
  
  # Background task scheduling
  workmanager: ^0.9.0
  
  # State management
  provider: ^6.1.1
  
  # Permission handling
  permission_handler: ^11.1.0
  
  # Text-to-Speech for voice announcements
  flutter_tts: ^4.2.0
  
  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  # Character images for overlay
  assets:
    - assets/images/
